<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Brightloop Software</title>
<style>
:root{
  --bg:#FAF6EE; --card:#FFFDF8; --border:#E8DFCF; --text:#3B3226; --muted:#8A7E6C;
  --teal:#2F6B6B; --teal-h:#255757; --danger:#B4553E; --ok:#4F7A5C; --head:#F2EADD;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;line-height:1.5;min-height:100vh}
#app{max-width:440px;margin:0 auto;padding:32px 16px 48px}
#app.wide{max-width:960px}
.wordmark{font-size:1.5rem;font-weight:700;letter-spacing:-.01em;text-align:center;margin:8px 0 20px}
.wordmark span{color:var(--teal)}
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;box-shadow:0 8px 30px rgba(59,50,38,.08);padding:28px;margin-bottom:20px}
@media(max-width:380px){.card{padding:20px}}
h1,h2{margin:0 0 6px;font-weight:650;letter-spacing:-.01em}
h1{font-size:1.4rem} h2{font-size:1.15rem}
.sub{color:var(--muted);margin:0 0 20px;font-size:.95rem}
.field{margin-bottom:16px}
label{display:block;font-weight:600;font-size:.9rem;margin-bottom:6px}
.opt{font-weight:400;color:var(--muted)}
input,select,textarea{width:100%;font:inherit;color:var(--text);background:#fff;border:1px solid var(--border);border-radius:10px;padding:11px 13px;outline:none;transition:box-shadow .15s,border-color .15s}
input:focus,select:focus,textarea:focus{border-color:var(--teal);box-shadow:0 0 0 3px rgba(47,107,107,.25)}
input.bad{border-color:var(--danger)}
input[readonly]{background:#F7F2E7}
.err{color:var(--danger);font-size:.83rem;margin-top:5px;min-height:0}
.err:empty{display:none}
.hint{color:var(--muted);font-size:.83rem;margin-top:5px}
.hint.ok{color:var(--ok)} .hint.no{color:var(--danger)}
.pw{position:relative}
.pw input{padding-right:68px}
.toggle{position:absolute;right:6px;top:50%;transform:translateY(-50%);background:none;border:0;color:var(--teal);font:inherit;font-size:.85rem;font-weight:600;padding:6px 8px;border-radius:8px;cursor:pointer}
.toggle:hover{background:var(--head)}
button{font:inherit}
button:focus-visible,a:focus-visible,[role=tab]:focus-visible{outline:3px solid rgba(47,107,107,.45);outline-offset:2px}
.btn{display:inline-block;background:var(--teal);color:#fff;border:0;border-radius:10px;padding:12px 18px;font-weight:600;cursor:pointer;transition:background .15s}
.btn:hover:not(:disabled){background:var(--teal-h)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.block{width:100%}
.btn.ghost{background:transparent;color:var(--teal);border:1px solid var(--border)}
.btn.ghost:hover:not(:disabled){background:var(--head)}
.btn.sm{padding:10px 14px;font-size:.9rem}
.link{color:var(--teal);background:none;border:0;padding:0;cursor:pointer;font:inherit;text-decoration:underline}
.link:hover{color:var(--teal-h)}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.center{text-align:center}
.mt{margin-top:16px}
.banner{border-radius:10px;padding:11px 14px;margin-bottom:16px;font-size:.92rem;word-break:break-word}
.banner[hidden]{display:none}
.banner.error{background:#F8E6E0;color:#8A3A27;border:1px solid #E9C3B8}
.banner.success{background:#E4EFE6;color:#35573F;border:1px solid #BFD6C4}
.checklist{list-style:none;margin:8px 0 0;padding:0;font-size:.85rem;color:var(--muted)}
.checklist li{padding-left:22px;position:relative;margin:2px 0}
.checklist li::before{content:"○";position:absolute;left:2px}
.checklist li.pass{color:var(--ok)}
.checklist li.pass::before{content:"✓";font-weight:700}
.grid{display:grid;gap:0 16px;grid-template-columns:1fr}
@media(min-width:620px){.grid{grid-template-columns:1fr 1fr}}
.inline{display:flex;gap:8px;flex-wrap:wrap}
.inline .pw{flex:1 1 200px}
.tabs{display:flex;gap:8px;margin-top:18px;border-bottom:1px solid var(--border)}
[role=tab]{flex:1;font-size:1.05rem;font-weight:650;padding:14px 10px;background:none;border:0;border-bottom:3px solid transparent;color:var(--muted);cursor:pointer;border-radius:10px 10px 0 0}
[role=tab][aria-selected=true]{color:var(--teal);border-bottom-color:var(--teal)}
[role=tab]:hover{background:var(--head)}
.tablewrap{overflow-x:auto;border:1px solid var(--border);border-radius:12px;margin-top:14px}
table{width:100%;border-collapse:separate;border-spacing:0;min-width:520px;font-size:.92rem}
th{background:var(--head);text-align:left;padding:11px 14px;font-weight:650;border-bottom:1px solid var(--border)}
td{padding:11px 14px;border-bottom:1px solid var(--border)}
tbody tr:nth-child(odd){background:#fff}
tbody tr:nth-child(even){background:var(--card)}
tbody tr:last-child td{border-bottom:0}
.empty{padding:28px;text-align:center;color:var(--muted)}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace}
.user{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.user span{color:var(--muted);font-size:.92rem}
</style>
</head>
<body>
<main id="app"></main>

<script>
/* =====================================================================
   Brightloop Software — single-file demo UI (no backend, in-memory state)
   ===================================================================== */

/* ---------- Validators ---------- */
const RE = {
  email: /^[^\s@]+@[^\s@]+\.[^\s@]+$/,
  phone: /^[+]?[\d\s-]{7,15}$/,
  aadhaar: /^\d{12}$/,
  upi: /^[a-zA-Z0-9._-]{2,256}@[a-zA-Z]{2,64}$/
};
const TAKEN_EMAILS = ['demo@brightloop.app'];
const TEMP_PASSWORD = 'temp';       // demo: forces change-password screen
const WRONG_PASSWORD = 'wrong';     // demo: invalid credentials

/** Password rules: >8 chars, upper, lower, special. */
const PW_RULES = [
  { key: 'len',   label: 'More than 8 characters', test: p => p.length > 8 },
  { key: 'upper', label: 'One uppercase letter',   test: p => /[A-Z]/.test(p) },
  { key: 'lower', label: 'One lowercase letter',   test: p => /[a-z]/.test(p) },
  { key: 'spec',  label: 'One special character',  test: p => /[^A-Za-z0-9]/.test(p) }
];
const pwValid = p => PW_RULES.every(r => r.test(p));
const normEmail = e => e.trim().toLowerCase();

/* ---------- App state (memory only) ---------- */
const state = { user: null, staff: [], admins: [], flash: null };
const app = document.getElementById('app');
const $ = (sel, root = document) => root.querySelector(sel);

/* ---------- Small helpers ---------- */
function wordmark() { return '<div class="wordmark">Brightloop<span> </span>Software</div>'.replace('Brightloop<span> </span>Software', 'Bright<span>loop</span> Software'); }

function field(id, label, o = {}) {
  const type = o.type || 'text';
  const input = `<input id="${id}" name="${id}" type="${type}" ${o.ac ? `autocomplete="${o.ac}"` : ''} ${o.ph ? `placeholder="${o.ph}"` : ''} ${o.attrs || ''}>`;
  return `<div class="field"><label for="${id}">${label}${o.optional ? ' <span class="opt">(optional)</span>' : ''}</label>${input}<div class="err" id="${id}-err" aria-live="polite"></div></div>`;
}
function pwField(id, label, ac = 'new-password') {
  return `<div class="field"><label for="${id}">${label}</label>
    <div class="pw"><input id="${id}" name="${id}" type="password" autocomplete="${ac}">
    <button type="button" class="toggle" data-for="${id}" aria-label="Show ${label.toLowerCase()}">Show</button></div>
    <div class="err" id="${id}-err" aria-live="polite"></div></div>`;
}
function checklist(id) {
  return `<ul class="checklist" id="${id}" aria-label="Password requirements">${PW_RULES.map(r => `<li data-k="${r.key}">${r.label}</li>`).join('')}</ul>`;
}
function banner() { return '<div class="banner" role="alert" hidden></div>'; }
function showBanner(root, type, msg) {
  const b = $('.banner', root);
  b.className = 'banner ' + type; b.textContent = msg; b.hidden = false;
}
function hideBanner(root) { $('.banner', root).hidden = true; }

/** Wire all Show/Hide toggles inside root. */
function bindToggles(root) {
  root.querySelectorAll('.toggle').forEach(btn => {
    btn.addEventListener('click', () => {
      const inp = document.getElementById(btn.dataset.for);
      const show = inp.type === 'password';
      inp.type = show ? 'text' : 'password';
      btn.textContent = show ? 'Hide' : 'Show';
      btn.setAttribute('aria-label', (show ? 'Hide ' : 'Show ') + 'password');
    });
  });
}
/** Tick the password checklist as the user types. */
function bindChecklist(inputId, listId) {
  const inp = document.getElementById(inputId), list = document.getElementById(listId);
  const update = () => PW_RULES.forEach(r => $(`[data-k="${r.key}"]`, list).classList.toggle('pass', r.test(inp.value)));
  inp.addEventListener('input', update); update();
}
/** Live "passwords match" indicator under the confirm field. */
function bindMatch(pwId, confId, hintId) {
  const p = document.getElementById(pwId), c = document.getElementById(confId), h = document.getElementById(hintId);
  const update = () => {
    if (!c.value) { h.textContent = ''; h.className = 'hint'; return; }
    const ok = p.value === c.value;
    h.textContent = ok ? '✓ Passwords match' : '✗ Passwords do not match';
    h.className = 'hint ' + (ok ? 'ok' : 'no');
  };
  p.addEventListener('input', update); c.addEventListener('input', update);
}
/**
 * Generic form validator. specs: [{id, check(value) -> error string or ''}]
 * Errors show only after a field is touched (or on submit). Submit button is
 * disabled until every check passes (and extra() is true).
 */
function makeForm(root, specs, btn, extra) {
  const touched = new Set();
  const refresh = () => {
    let ok = true;
    specs.forEach(s => {
      const el = document.getElementById(s.id), msg = s.check(el.value);
      if (msg) ok = false;
      const show = touched.has(s.id) && msg;
      $('#' + s.id + '-err', root).textContent = show ? msg : '';
      el.classList.toggle('bad', !!show);
      el.setAttribute('aria-invalid', show ? 'true' : 'false');
    });
    if (extra && !extra()) ok = false;
    btn.disabled = !ok;
    return ok;
  };
  specs.forEach(s => {
    const el = document.getElementById(s.id);
    el.addEventListener('input', () => { touched.add(s.id); refresh(); });
    el.addEventListener('blur', () => { touched.add(s.id); refresh(); });
  });
  refresh();
  return { refresh, touchAll: () => { specs.forEach(s => touched.add(s.id)); refresh(); } };
}
const req = label => v => v.trim() ? '' : `${label} is required.`;
const emailCheck = v => !v.trim() ? 'Email is required.' : RE.email.test(v.trim()) ? '' : 'Enter a valid email address.';
const phoneCheck = v => !v.trim() ? 'Phone is required.' : RE.phone.test(v.trim()) ? '' : 'Enter a valid phone number (7–15 digits).';
const pwCheck = v => pwValid(v) ? '' : 'Password does not meet all requirements.';

function mount(html, wide) {
  app.className = wide ? 'wide' : '';
  app.innerHTML = html;
  window.scrollTo(0, 0);
  return app;
}
function consumeFlash(root) {
  if (state.flash) { showBanner(root, state.flash.type, state.flash.msg); state.flash = null; }
}
function go(screen) {
  const url = new URL(location.href); url.searchParams.set('screen', screen);
  try { history.replaceState(null, '', url); } catch (e) { /* file:// may block; ignore */ }
  const fn = SCREENS[screen] || SCREENS.login;
  fn();
}
function wireLinks(root) {
  root.querySelectorAll('[data-go]').forEach(a => a.addEventListener('click', () => go(a.dataset.go)));
}

/** Random 16-char password that satisfies every rule. */
function generatePassword() {
  const rnd = n => crypto.getRandomValues(new Uint32Array(1))[0] % n;
  const S = { u: 'ABCDEFGHJKLMNPQRSTUVWXYZ', l: 'abcdefghijkmnopqrstuvwxyz', d: '23456789', s: '!@#$%^&*?-_+=' };
  const all = S.u + S.l + S.d + S.s;
  const chars = [S.u[rnd(S.u.length)], S.l[rnd(S.l.length)], S.s[rnd(S.s.length)]];
  while (chars.length < 16) chars.push(all[rnd(all.length)]);
  for (let i = chars.length - 1; i > 0; i--) { const j = rnd(i + 1); [chars[i], chars[j]] = [chars[j], chars[i]]; }
  return chars.join('');
}
function copyText(text) {
  if (navigator.clipboard && window.isSecureContext) return navigator.clipboard.writeText(text);
  return new Promise((res, rej) => { // fallback for file:// pages
    const t = document.createElement('textarea'); t.value = text; document.body.appendChild(t); t.select();
    try { document.execCommand('copy') ? res() : rej(); } catch (e) { rej(e); } t.remove();
  });
}
function nameFromEmail(e) {
  const n = e.split('@')[0].replace(/[._-]+/g, ' ').trim();
  return n.replace(/\b\w/g, c => c.toUpperCase()) || 'User';
}

/* =====================================================================
   SCREEN 1 — Login
   ===================================================================== */
function loginScreen() {
  const root = mount(wordmark() + `<section class="card" aria-labelledby="t">
    ${banner()}
    <h1 id="t">Welcome back</h1><p class="sub">Log in to manage subscriptions.</p>
    <form id="f" novalidate>
      <div class="field"><label for="role">Role</label>
        <select id="role"><option>Admin</option><option>Staff</option><option>Customer</option></select></div>
      ${field('email', 'Email', { type: 'email', ac: 'username' })}
      ${pwField('pw', 'Password', 'current-password')}
      <div class="field" style="margin-top:-6px"><button type="button" class="link" data-go="forgot">Forgot password?</button></div>
      <button class="btn block" id="go" type="submit">Login</button>
    </form>
    <p class="hint">Demo: password “${WRONG_PASSWORD}” = invalid, “${TEMP_PASSWORD}” = forced change, anything else signs in.</p>
    <p class="center mt">Don't have an account? <button type="button" class="link" data-go="signup">Sign up</button></p>
  </section>`);
  consumeFlash(root); bindToggles(root); wireLinks(root);
  const f = makeForm(root, [
    { id: 'email', check: emailCheck },
    { id: 'pw', check: v => v ? '' : 'Password is required.' }
  ], $('#go', root));
  $('#f', root).addEventListener('submit', e => {
    e.preventDefault(); f.touchAll();
    if ($('#go', root).disabled) return;
    const pw = $('#pw', root).value, email = $('#email', root).value.trim(), role = $('#role', root).value;
    if (pw === WRONG_PASSWORD) return showBanner(root, 'error', 'Invalid email or password');
    state.user = { name: nameFromEmail(email), email, role };
    if (pw === TEMP_PASSWORD) return go('change');
    go(role.toLowerCase());
  });
}

/* =====================================================================
   SCREEN 2 — Customer Signup
   ===================================================================== */
function signupScreen() {
  const root = mount(wordmark() + `<section class="card" aria-labelledby="t">
    ${banner()}
    <h1 id="t">Create your account</h1><p class="sub">Customer sign-up</p>
    <form id="f" novalidate>
      ${field('name', 'Full name', { ac: 'name' })}
      ${field('email', 'Email', { type: 'email', ac: 'email' })}
      <div class="hint" id="email-hint" style="margin-top:-10px;margin-bottom:16px"></div>
      ${field('phone', 'Phone', { type: 'tel', ac: 'tel', ph: '+91 98765 43210' })}
      <div class="field"><label for="addr">Address <span class="opt">(optional)</span></label>
        <textarea id="addr" rows="2" autocomplete="street-address"></textarea>
        <div class="mt"><button type="button" class="btn ghost sm" id="loc">Use my current location</button></div>
        <div class="grid mt"><div><label for="lat">Latitude</label><input id="lat" readonly></div>
        <div><label for="lng">Longitude</label><input id="lng" readonly></div></div>
        <div class="hint" id="loc-hint"></div></div>
      ${pwField('pw', 'Password')}
      ${checklist('cl')}
      <div style="height:14px"></div>
      ${pwField('pw2', 'Confirm password')}
      <div class="hint" id="match" style="margin:-10px 0 16px"></div>
      <button class="btn block" id="go" type="submit">Create account</button>
    </form>
    <p class="center mt">Already have an account? <button type="button" class="link" data-go="login">Login</button></p>
  </section>`);
  bindToggles(root); wireLinks(root); bindChecklist('pw', 'cl'); bindMatch('pw', 'pw2', 'match');
  const emailEl = $('#email', root), eh = $('#email-hint', root);
  const taken = () => TAKEN_EMAILS.includes(normEmail(emailEl.value));
  const updateEmailHint = () => {
    if (!RE.email.test(emailEl.value.trim())) { eh.textContent = ''; return; }
    eh.textContent = taken() ? '✗ This email is already registered.' : '✓ Email is available';
    eh.className = 'hint ' + (taken() ? 'no' : 'ok');
  };
  const f = makeForm(root, [
    { id: 'name', check: req('Full name') },
    { id: 'email', check: v => emailCheck(v) || (TAKEN_EMAILS.includes(normEmail(v)) ? 'Email already registered.' : '') },
    { id: 'phone', check: phoneCheck },
    { id: 'pw', check: pwCheck },
    { id: 'pw2', check: v => v && v === $('#pw', root).value ? '' : 'Passwords do not match.' }
  ], $('#go', root));
  emailEl.addEventListener('input', updateEmailHint);
  $('#pw', root).addEventListener('input', f.refresh);
  $('#loc', root).addEventListener('click', () => {
    const h = $('#loc-hint', root);
    if (!navigator.geolocation) { h.textContent = 'Geolocation is not supported by this browser.'; h.className = 'hint no'; return; }
    h.textContent = 'Locating…'; h.className = 'hint';
    navigator.geolocation.getCurrentPosition(p => {
      $('#lat', root).value = p.coords.latitude.toFixed(6);
      $('#lng', root).value = p.coords.longitude.toFixed(6);
      h.textContent = 'Location captured.'; h.className = 'hint ok';
    }, err => { h.textContent = 'Could not get location: ' + err.message; h.className = 'hint no'; });
  });
  $('#f', root).addEventListener('submit', e => {
    e.preventDefault(); if ($('#go', root).disabled) return;
    state.flash = { type: 'success', msg: 'Account created. Please log in.' };
    go('login');
  });
}

/* =====================================================================
   SCREEN 3 — Forgot Password (always neutral)
   ===================================================================== */
function forgotScreen() {
  const root = mount(wordmark() + `<section class="card" aria-labelledby="t">
    ${banner()}
    <h1 id="t">Forgot password?</h1><p class="sub">Enter your email and we'll send a reset link.</p>
    <form id="f" novalidate>
      ${field('email', 'Email', { type: 'email', ac: 'email' })}
      <button class="btn block" id="go" type="submit">Send reset link</button>
    </form>
    <p class="center mt"><button type="button" class="link" data-go="login">Back to login</button></p>
    <p class="center hint">Demo: <button type="button" class="link" data-go="reset">open the reset screen</button></p>
  </section>`);
  wireLinks(root);
  const f = makeForm(root, [{ id: 'email', check: emailCheck }], $('#go', root));
  $('#f', root).addEventListener('submit', e => {
    e.preventDefault(); if ($('#go', root).disabled) return;
    showBanner(root, 'success', 'If that email exists, a reset link has been sent.'); // never reveals existence
  });
}

/* =====================================================================
   SCREEN 4 — Reset Password
   ===================================================================== */
function resetScreen() {
  const root = mount(wordmark() + `<section class="card" aria-labelledby="t">
    ${banner()}
    <h1 id="t">Set a new password</h1><p class="sub">Choose a strong password.</p>
    <form id="f" novalidate>
      ${pwField('pw', 'New password')}
      ${checklist('cl')}
      <div style="height:14px"></div>
      ${pwField('pw2', 'Confirm password')}
      <div class="hint" id="match" style="margin:-10px 0 16px"></div>
      <button class="btn block" id="go" type="submit">Reset password</button>
    </form>
    <p class="center mt"><button type="button" class="link" data-go="login">Back to login</button></p>
  </section>`);
  bindToggles(root); wireLinks(root); bindChecklist('pw', 'cl'); bindMatch('pw', 'pw2', 'match');
  const f = makeForm(root, [
    { id: 'pw', check: pwCheck },
    { id: 'pw2', check: v => v && v === $('#pw', root).value ? '' : 'Passwords do not match.' }
  ], $('#go', root));
  $('#pw', root).addEventListener('input', f.refresh);
  $('#f', root).addEventListener('submit', e => {
    e.preventDefault(); if ($('#go', root).disabled) return;
    state.flash = { type: 'success', msg: 'Password reset. Please log in.' };
    go('login');
  });
}

/* =====================================================================
   SCREEN 5 — Change Password (forced on first login)
   ===================================================================== */
function changeScreen() {
  const root = mount(wordmark() + `<section class="card" aria-labelledby="t">
    ${banner()}
    <h1 id="t">Change your password</h1><p class="sub">You're using a temporary password. Set a new one to continue.</p>
    <form id="f" novalidate>
      ${pwField('cur', 'Current password', 'current-password')}
      ${pwField('pw', 'New password')}
      ${checklist('cl')}
      <div style="height:14px"></div>
      ${pwField('pw2', 'Confirm new password')}
      <div class="hint" id="match" style="margin:-10px 0 16px"></div>
      <button class="btn block" id="go" type="submit">Change password</button>
    </form>
    <p class="hint">Demo: current password must be “${TEMP_PASSWORD}”.</p>
  </section>`);
  bindToggles(root); bindChecklist('pw', 'cl'); bindMatch('pw', 'pw2', 'match');
  const f = makeForm(root, [
    { id: 'cur', check: v => v ? '' : 'Current password is required.' },
    { id: 'pw', check: pwCheck },
    { id: 'pw2', check: v => v && v === $('#pw', root).value ? '' : 'Passwords do not match.' }
  ], $('#go', root));
  $('#pw', root).addEventListener('input', f.refresh);
  $('#f', root).addEventListener('submit', e => {
    e.preventDefault(); if ($('#go', root).disabled) return;
    if ($('#cur', root).value !== TEMP_PASSWORD) return showBanner(root, 'error', 'Current password is incorrect.');
    const role = (state.user && state.user.role || 'Customer').toLowerCase();
    go(role);
  });
}

/* =====================================================================
   SCREEN 6 — Admin Dashboard (Staff + Admins tabs)
   ===================================================================== */
function formatAadhaar(v) { return v.replace(/\D/g, '').slice(0, 12).replace(/(\d{4})(?=\d)/g, '$1 '); }
const maskAadhaar = d => 'XXXX XXXX ' + d.slice(-4);

/** Builds one "Add person" card (kind = 'staff' | 'admin') and wires it up. */
function personCard(kind) {
  const isAdmin = kind === 'admin', p = kind;
  return `<section class="card" aria-labelledby="${p}-t">
    ${banner()}
    <h2 id="${p}-t">${isAdmin ? 'Add admin' : 'Add staff member'}</h2>
    <p class="sub">${isAdmin ? 'Create an administrator account.' : 'Create a staff account with a temporary password.'}</p>
    <form id="${p}-f" novalidate>
      <div class="grid">
        ${field(p + '-name', 'Name')}
        ${field(p + '-email', 'Email', { type: 'email' })}
        ${field(p + '-phone', 'Phone', { type: 'tel' })}
        ${field(p + '-emp', 'Employee ID')}
        ${isAdmin ? field(p + '-aad', 'Aadhaar', { attrs: 'inputmode="numeric" placeholder="XXXX XXXX XXXX" maxlength="14"' }) : ''}
        ${isAdmin ? field(p + '-upi', 'GPay / UPI ID', { ph: 'name@bank' }) : ''}
      </div>
      <div class="field"><label for="${p}-tmp">Temporary password</label>
        <div class="inline">
          <div class="pw"><input id="${p}-tmp" type="password" autocomplete="new-password">
            <button type="button" class="toggle" data-for="${p}-tmp" aria-label="Show password">Show</button></div>
          <button type="button" class="btn ghost sm" id="${p}-gen">Auto-generate</button>
          <button type="button" class="btn ghost sm" id="${p}-copy">Copy</button>
        </div>
        <div class="err" id="${p}-tmp-err" aria-live="polite"></div>
        ${checklist(p + '-cl')}</div>
      <button class="btn" id="${p}-go" type="submit">${isAdmin ? 'Create admin' : 'Create staff member'}</button>
    </form>
    <div class="tablewrap" id="${p}-table"></div>
  </section>`;
}
function renderTable(kind, root) {
  const list = kind === 'admin' ? state.admins : state.staff, box = $('#' + kind + '-table', root);
  if (!list.length) { box.innerHTML = `<div class="empty">No ${kind === 'admin' ? 'admins' : 'staff'} yet</div>`; return; }
  const cols = kind === 'admin'
    ? ['Name', 'Email', 'Emp ID', 'Aadhaar', 'UPI', 'Created']
    : ['Name', 'Email', 'Emp ID', 'Created'];
  const t = document.createElement('table');
  t.innerHTML = `<thead><tr>${cols.map(c => `<th scope="col">${c}</th>`).join('')}</tr></thead><tbody></tbody>`;
  list.forEach(r => {
    const tr = document.createElement('tr');
    const cells = kind === 'admin'
      ? [r.name, r.email, r.emp, maskAadhaar(r.aadhaar), r.upi, r.created]
      : [r.name, r.email, r.emp, r.created];
    cells.forEach((c, i) => { const td = document.createElement('td'); td.textContent = c; if (kind === 'admin' && i === 3) td.className = 'mono'; tr.appendChild(td); });
    $('tbody', t).appendChild(tr);
  });
  box.innerHTML = ''; box.appendChild(t);
}
function wirePersonCard(kind, panel) {
  const p = kind, isAdmin = kind === 'admin', list = isAdmin ? state.admins : state.staff;
  const btn = $('#' + p + '-go', panel), tmp = $('#' + p + '-tmp', panel);
  bindToggles(panel); bindChecklist(p + '-tmp', p + '-cl'); renderTable(kind, panel);
  const aad = isAdmin ? $('#' + p + '-aad', panel) : null;
  if (aad) aad.addEventListener('input', () => { aad.value = formatAadhaar(aad.value); });
  const dupEmail = v => state.staff.concat(state.admins).some(r => r.email.toLowerCase() === normEmail(v));
  const specs = [
    { id: p + '-name', check: req('Name') },
    { id: p + '-email', check: v => emailCheck(v) || (dupEmail(v) ? 'This email is already in use.' : '') },
    { id: p + '-phone', check: phoneCheck },
    { id: p + '-emp', check: req('Employee ID') },
    { id: p + '-tmp', check: v => pwValid(v) ? '' : 'Temporary password must meet all requirements.' }
  ];
  if (isAdmin) specs.splice(4, 0,
    { id: p + '-aad', check: v => !v.trim() ? 'Aadhaar is required.' : RE.aadhaar.test(v.replace(/\s/g, '')) ? '' : 'Aadhaar must be 12 digits.' },
    { id: p + '-upi', check: v => !v.trim() ? 'UPI ID is required.' : RE.upi.test(v.trim()) ? '' : 'Enter a valid UPI ID (name@bank).' });
  const f = makeForm(panel, specs, btn);
  $('#' + p + '-gen', panel).addEventListener('click', () => {
    tmp.value = generatePassword(); tmp.dispatchEvent(new Event('input'));
  });
  const copyBtn = $('#' + p + '-copy', panel);
  copyBtn.addEventListener('click', () => {
    if (!tmp.value) return;
    copyText(tmp.value).then(() => {
      copyBtn.textContent = 'Copied ✓'; setTimeout(() => copyBtn.textContent = 'Copy', 1500);
    }).catch(() => { copyBtn.textContent = 'Press Ctrl+C'; setTimeout(() => copyBtn.textContent = 'Copy', 1800); tmp.type = 'text'; tmp.select(); });
  });
  $('#' + p + '-f', panel).addEventListener('submit', e => {
    e.preventDefault(); if (btn.disabled) return;
    const v = id => $('#' + p + '-' + id, panel).value.trim();
    const rec = { name: v('name'), email: v('email'), phone: v('phone'), emp: v('emp'), created: new Date().toLocaleString() };
    if (isAdmin) { rec.aadhaar = v('aad').replace(/\s/g, ''); rec.upi = v('upi'); }
    list.push(rec);
    const pwUsed = tmp.value;
    $('#' + p + '-f', panel).reset();
    tmp.type = 'password'; tmp.dispatchEvent(new Event('input'));
    panel.querySelectorAll('.err').forEach(x => x.textContent = '');
    panel.querySelectorAll('input.bad').forEach(x => x.classList.remove('bad'));
    f.refresh();
    showBanner(panel, 'success', `${isAdmin ? 'Admin' : 'Staff member'} created. Temp password: ${pwUsed}`);
    renderTable(kind, panel);
  });
}
function adminScreen() {
  if (!state.user) state.user = { name: 'Admin', role: 'Admin' };
  const root = mount(wordmark() + `
    <section class="card">
      <div class="row">
        <h1>Admin Dashboard</h1>
        <div class="user"><span>${state.user.name.replace(/[<>&]/g, '')}</span><button class="btn ghost sm" id="out" type="button">Sign out</button></div>
      </div>
      <div class="tabs" role="tablist" aria-label="Admin sections">
        <button role="tab" id="tab-staff" aria-controls="panel-staff" aria-selected="true">Staff</button>
        <button role="tab" id="tab-admin" aria-controls="panel-admin" aria-selected="false" tabindex="-1">Admins</button>
      </div>
    </section>
    <div id="panel-staff" role="tabpanel" aria-labelledby="tab-staff">${personCard('staff')}</div>
    <div id="panel-admin" role="tabpanel" aria-labelledby="tab-admin" hidden>${personCard('admin')}</div>`, true);
  wirePersonCard('staff', $('#panel-staff', root));
  wirePersonCard('admin', $('#panel-admin', root));
  // Tab switching (panels stay mounted so form state is preserved)
  const tabs = ['staff', 'admin'];
  const select = which => tabs.forEach(t => {
    const on = t === which;
    $('#tab-' + t, root).setAttribute('aria-selected', on);
    $('#tab-' + t, root).tabIndex = on ? 0 : -1;
    $('#panel-' + t, root).hidden = !on;
  });
  tabs.forEach(t => {
    const el = $('#tab-' + t, root);
    el.addEventListener('click', () => select(t));
    el.addEventListener('keydown', e => {
      if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') { const o = t === 'staff' ? 'admin' : 'staff'; select(o); $('#tab-' + o, root).focus(); }
    });
  });
  $('#out', root).addEventListener('click', signOut);
}

/* =====================================================================
   SCREENS 7 & 8 — Placeholders
   ===================================================================== */
function placeholderScreen(title, text) {
  if (!state.user) state.user = { name: title, role: title };
  const root = mount(wordmark() + `<section class="card center">
    <h1>${title}</h1><p class="sub">Signed in as ${state.user.name.replace(/[<>&]/g, '')}. ${text}</p>
    <button class="btn" id="out" type="button">Sign out</button></section>`);
  $('#out', root).addEventListener('click', signOut);
}
const staffScreen = () => placeholderScreen('Staff Dashboard', 'Your staff tools will appear here.');
const customerScreen = () => placeholderScreen('Customer Portal', 'Your subscriptions will appear here.');
function signOut() { state.user = null; state.flash = { type: 'success', msg: 'You have been signed out.' }; go('login'); }

/* =====================================================================
   Router + deep-linking (?screen=login|signup|forgot|reset|change|admin|staff|customer)
   ===================================================================== */
const SCREENS = { login: loginScreen, signup: signupScreen, forgot: forgotScreen, reset: resetScreen,
                  change: changeScreen, admin: adminScreen, staff: staffScreen, customer: customerScreen };
const initial = new URLSearchParams(location.search).get('screen');
(SCREENS[initial] || SCREENS.login)();
</script>
</body>
